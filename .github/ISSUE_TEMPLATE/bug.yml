name: Bug
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: App screen, API route, or file and line
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove phone numbers, GSTINs, PANs, amounts and tokens first.
