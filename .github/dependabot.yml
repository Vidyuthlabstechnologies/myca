version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
    groups:
      platform-dev:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cloud
    schedule:
      interval: weekly
    groups:
      cloud:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      flutter-packages:
        patterns: ["*"]
