version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
    groups:
      platform-dev:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cloud
    schedule:
      interval: weekly
    groups:
      cloud:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /email-relay
    schedule:
      interval: weekly
    groups:
      email-relay:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /design
    schedule:
      interval: weekly
    groups:
      design:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      flutter-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/cloud", "/deploy/site"]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /design/flutter/myca_design
    schedule:
      interval: weekly
    groups:
      design-flutter:
        patterns: ["*"]
