name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package MyCA for Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Build NSIS + portable installers
        working-directory: platform
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack

      - name: Write SHA256SUMS
        working-directory: platform
        run: node scripts/sha256sums.mjs dist

      - name: List build output
        working-directory: platform
        shell: bash
        run: ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: myca-windows
          path: |
            platform/dist/*.exe
            platform/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ARTIFACTS_BUCKET: ${{ vars.GCP_ARTIFACTS_BUCKET }}
      DOWNLOADS_BUCKET: ${{ vars.GCP_DOWNLOADS_BUCKET }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9.]+$ ]] || { echo "::error::release tag must match ^v[0-9.]+\$"; exit 1; }

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: myca-windows
          path: dist

      - name: Verify SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          [ "$(ls -1 *.exe | wc -l)" -eq "$(wc -l < SHA256SUMS)" ] || { echo "::error::SHA256SUMS does not cover every installer"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Authenticate to Google Cloud
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: vars.GCP_WIF_PROVIDER != ''

      - name: Archive versioned installers
        if: vars.GCP_WIF_PROVIDER != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp dist/*.exe dist/SHA256SUMS "gs://${ARTIFACTS_BUCKET}/releases/${RELEASE_TAG}/"

      - name: Publish stable download aliases
        if: vars.GCP_WIF_PROVIDER != ''
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls dist/"MyCA Setup "*.exe | head -n1)
          portable=$(ls dist/"MyCA "[0-9]*.exe | head -n1)
          echo "setup=$setup"
          echo "portable=$portable"
          gcloud storage cp "$setup" \
            "gs://${DOWNLOADS_BUCKET}/myca-setup.exe" \
            --cache-control="public, max-age=86400"
          gcloud storage cp "$portable" \
            "gs://${DOWNLOADS_BUCKET}/myca-portable.exe" \
            --cache-control="public, max-age=86400"
