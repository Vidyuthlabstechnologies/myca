name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package MyCA for Windows
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_SIGNING_CERT: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Build NSIS + portable installers
        working-directory: platform
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack

      - name: Verify Authenticode signatures
        if: env.HAS_SIGNING_CERT == 'true'
        working-directory: platform
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem dist -Filter *.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) {
            $unsigned | ForEach-Object { Write-Output "::error::installer is not validly signed: $($_.Name)" }
            exit 1
          }

      - name: Write SHA256SUMS
        working-directory: platform
        run: node scripts/sha256sums.mjs dist

      - name: List build output
        working-directory: platform
        shell: bash
        run: ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myca-windows
          path: |
            platform/dist/*.exe
            platform/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ARTIFACTS_BUCKET: ${{ vars.GCP_ARTIFACTS_BUCKET }}
      DOWNLOADS_BUCKET: ${{ vars.GCP_DOWNLOADS_BUCKET }}
      URL_MAP: ${{ vars.GCP_URL_MAP }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9.]+$ ]] || { echo "::error::release tag must match ^v[0-9.]+\$"; exit 1; }

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-windows
          path: dist

      - name: Verify SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          [ "$(ls -1 *.exe | wc -l)" -eq "$(wc -l < SHA256SUMS)" ] || { echo "::error::SHA256SUMS does not cover every installer"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Authenticate to Google Cloud
        if: vars.GCP_WIF_PROVIDER != '' && vars.MYCA_MANAGE_SITE == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: vars.GCP_WIF_PROVIDER != '' && vars.MYCA_MANAGE_SITE == 'true'

      - name: Archive versioned installers
        if: vars.GCP_WIF_PROVIDER != '' && vars.MYCA_MANAGE_SITE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp dist/*.exe dist/SHA256SUMS "gs://${ARTIFACTS_BUCKET}/releases/${RELEASE_TAG}/"

      - name: Point download aliases at the highest archived release
        if: vars.GCP_WIF_PROVIDER != '' && vars.MYCA_MANAGE_SITE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          highest=$(gcloud storage ls "gs://${ARTIFACTS_BUCKET}/releases/" \
            | sed -nE 's#^gs://[^/]+/releases/(v[0-9.]+)/$#\1#p' | sort -V | tail -n1)
          [[ "$highest" =~ ^v[0-9.]+$ ]] || { echo "::error::no archived release found"; exit 1; }
          echo "highest archived release: ${highest} (this run: ${RELEASE_TAG})"
          rm -rf alias && mkdir alias
          gcloud storage cp "gs://${ARTIFACTS_BUCKET}/releases/${highest}/*" alias/
          cd alias
          sha256sum -c SHA256SUMS
          setup=$(ls "MyCA Setup "*.exe | head -n1)
          portable=$(ls "MyCA "[0-9]*.exe | head -n1)
          cp -- "$setup" myca-setup.exe
          cp -- "$portable" myca-portable.exe
          sha256sum myca-setup.exe myca-portable.exe > downloads-SHA256SUMS
          for f in myca-setup.exe myca-portable.exe; do
            gcloud storage cp "$f" "gs://${DOWNLOADS_BUCKET}/downloads/$f" --cache-control="public, max-age=300"
          done
          gcloud storage cp downloads-SHA256SUMS "gs://${DOWNLOADS_BUCKET}/downloads/SHA256SUMS" --cache-control="public, max-age=300"

      - name: Purge download aliases from Cloud CDN
        if: vars.GCP_WIF_PROVIDER != '' && vars.MYCA_MANAGE_SITE == 'true'
        run: gcloud compute url-maps invalidate-cdn-cache "${URL_MAP}" --path "/downloads/*"
