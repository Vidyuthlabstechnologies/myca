name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases
  id-token: write # Workload Identity Federation

jobs:
  build:
    name: Package MyCA for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Build NSIS + portable installers
        working-directory: platform
        env:
          # Unsigned by default. When a code-signing certificate is added as the
          # repo secret CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD, electron-builder
          # signs automatically — nothing else to change.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack

      - name: List build output
        working-directory: platform
        shell: bash
        run: ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: myca-windows
          path: platform/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platform/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Authenticate to Google Cloud
        if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WIF_PROVIDER != ''

      - name: Archive versioned installers
        if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WIF_PROVIDER != ''
        shell: bash
        run: |
          gcloud storage cp platform/dist/*.exe \
            "gs://${{ vars.GCP_ARTIFACTS_BUCKET }}/releases/${{ github.ref_name }}/"

      - name: Publish stable download aliases
        if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WIF_PROVIDER != ''
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls dist/"MyCA Setup "*.exe | head -n1)
          portable=$(ls dist/"MyCA "[0-9]*.exe | head -n1)
          echo "setup=$setup"
          echo "portable=$portable"
          gcloud storage cp "$setup" \
            "gs://${{ vars.GCP_DOWNLOADS_BUCKET }}/myca-setup.exe" \
            --cache-control="public, max-age=86400"
          gcloud storage cp "$portable" \
            "gs://${{ vars.GCP_DOWNLOADS_BUCKET }}/myca-portable.exe" \
            --cache-control="public, max-age=86400"
