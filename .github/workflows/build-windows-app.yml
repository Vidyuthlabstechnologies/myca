name: Build Windows app (hosted)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MyCA for Windows on the hosted service
    runs-on: windows-latest
    env:
      CLOUD_URL: ${{ vars.MYCA_CLOUD_URL }}
      OIDC_CLIENT_ID: ${{ vars.MYCA_OIDC_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter at the pinned version
        shell: bash
        env:
          FLUTTER_VERSION: "3.44.9"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test before building
        working-directory: mobile
        shell: bash
        run: |
          flutter analyze
          flutter test

      - name: Build
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          define=(--build-number="$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then define+=(--build-name="${GITHUB_REF_NAME#v}"); fi
          if [ -n "$CLOUD_URL" ]; then define+=(--dart-define="MYCA_CLOUD_URL=$CLOUD_URL"); fi
          if [ -n "$OIDC_CLIENT_ID" ]; then define+=(--dart-define="MYCA_OIDC_CLIENT_ID=$OIDC_CLIENT_ID"); fi
          flutter build windows --release "${define[@]}"
          mkdir -p ../dist
          (cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../../dist/myca-windows-app.zip . > /dev/null)
          (cd ../dist && sha256sum myca-windows-app.zip > SHA256SUMS-windows-app.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myca-windows-app
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-windows-app
          path: dist
      - name: Upload the files to the tag's release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "MyCA $tag" --draft=false
          fi
          gh release upload "$tag" dist/myca-windows-app.zip dist/SHA256SUMS-windows-app.txt --repo "$GITHUB_REPOSITORY" --clobber
