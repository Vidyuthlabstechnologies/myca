name: Website quality

on:
  pull_request:
    paths:
      - "deploy/**"
      - "cloud/src/billing.mjs"
      - "cloud/src/consent.mjs"
      - ".github/workflows/site-quality.yml"
  push:
    branches: [main, develop]
    paths:
      - "deploy/**"
      - ".github/workflows/site-quality.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Links, headers, phone layout, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the generated pages, sitemap, legal pages and server config
        run: node --test deploy/seo/*.test.mjs

      - name: Install the checkers
        working-directory: deploy/qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build and start the production image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/site/Dockerfile -t myca-site:ci .
          docker run -d --name myca-site -p 8080:8080 myca-site:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          docker logs myca-site
          exit 1

      - name: Check every page, link, header, layout and accessibility rule
        working-directory: deploy/qa
        run: node check-site.mjs http://localhost:8080 ${{ github.event_name == 'schedule' && '--external' || '' }}

      - name: Check Lighthouse scores
        working-directory: deploy/qa
        run: node lighthouse.mjs http://localhost:8080

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-quality-reports
          path: deploy/qa/reports/
          if-no-files-found: ignore
