name: Deploy hosted API (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "platform/src/**"
      - "sprints/**"
      - ".github/workflows/deploy-cloud.yml"
      - ".github/workflows/cloud-run-rollout.yml"
  workflow_dispatch:
    inputs:
      country:
        description: "Which country's stack to deploy. Each country is its own project, so a US rollout never touches India's."
        type: choice
        options: [IN, US]
        default: IN

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  test:
    name: Hosted API suite
    # Skips cleanly until the cloud project, its registry and the GitHub variables exist.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_API_REGION != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myca
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: "--health-cmd \"pg_isready -U myca\" --health-interval 5s --health-timeout 5s --health-retries 12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The suite must pass before anything is built
        working-directory: cloud
        env:
          MYCA_TEST_DATABASE_URL: postgres://myca@127.0.0.1:5432/postgres
        run: |
          npm ci --ignore-scripts
          npm test

  staging:
    name: Staging
    needs: test
    if: ${{ vars.GCP_PROJECT_ID_STAGING != '' && (inputs.country || 'IN') == 'IN' }}
    uses: ./.github/workflows/cloud-run-rollout.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: staging
      server_environment: staging
      country: IN
      project: ${{ vars.GCP_PROJECT_ID_STAGING }}
      region: ${{ vars.GCP_API_REGION_STAGING || vars.GCP_API_REGION }}
      wif_provider: ${{ vars.GCP_WIF_PROVIDER_STAGING || vars.GCP_WIF_PROVIDER }}
      deploy_sa: ${{ vars.GCP_DEPLOY_SA_STAGING || vars.GCP_DEPLOY_SA }}
      service: myca-staging-api

  production:
    name: Production
    needs: [test, staging]
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.staging.result) }}
    uses: ./.github/workflows/cloud-run-rollout.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: ${{ inputs.country == 'US' && 'production-us' || 'production' }}
      server_environment: production
      country: ${{ inputs.country || 'IN' }}
      project: ${{ inputs.country == 'US' && vars.GCP_PROJECT_ID_US || vars.GCP_PROJECT_ID }}
      region: ${{ inputs.country == 'US' && vars.GCP_API_REGION_US || vars.GCP_API_REGION }}
      wif_provider: ${{ inputs.country == 'US' && vars.GCP_WIF_PROVIDER_US || vars.GCP_WIF_PROVIDER }}
      deploy_sa: ${{ inputs.country == 'US' && vars.GCP_DEPLOY_SA_US || vars.GCP_DEPLOY_SA }}
      service: myca-api
