name: Deploy hosted API (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "platform/src/**"
      - "sprints/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  test:
    name: Hosted API suite
    # Skips cleanly until the cloud project, its registry and the GitHub variables exist.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_API_REGION != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myca
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: "--health-cmd \"pg_isready -U myca\" --health-interval 5s --health-timeout 5s --health-retries 12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The suite must pass before anything is built
        working-directory: cloud
        env:
          MYCA_TEST_DATABASE_URL: postgres://myca@127.0.0.1:5432/postgres
        run: |
          npm ci --ignore-scripts
          npm test

  deploy:
    name: Build the image and roll out
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_API_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: myca-api
      IMAGE: ${{ vars.GCP_API_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/myca-api/myca-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f cloud/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll out; the previous revision keeps serving until the new one passes its probes
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" \
            --quiet

      - name: Check the live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url/v1/health" | grep -q '"ok":true'; then
              echo "healthy: $url" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "the new revision never answered /v1/health" >&2
          exit 1
