name: Build iOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "Which store app to build: india (com.mldynamic.myca) or us (com.mldynamic.myca.us, MyCA US)."
        type: choice
        options: [india, us]
        default: india

permissions:
  contents: read

jobs:
  build:
    name: iOS app ${{ inputs.app || 'india' }} (signed and sent to TestFlight when the Apple secrets exist)
    runs-on: macos-latest
    env:
      APP: ${{ inputs.app || 'india' }}
      CLOUD_URL: ${{ (inputs.app == 'us' && vars.MYCA_CLOUD_URL_US) || vars.MYCA_CLOUD_URL }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && ((inputs.app == 'us' && secrets.APPLE_PROVISIONING_PROFILE_BASE64_US) || (inputs.app != 'us' && secrets.APPLE_PROVISIONING_PROFILE_BASE64)) != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_APP_STORE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter at the pinned version
        shell: bash
        env:
          FLUTTER_VERSION: "3.44.9"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test before building
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Choose the store app
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          # MyCA US is its own App Store app, like the Android flavor `us`: its own bundle id and name,
          # and MYCA_EDITION=US so it opens straight into the US experience (editionFor in app_config.dart).
          if [ "$APP" = "us" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.mldynamic.myca;/PRODUCT_BUNDLE_IDENTIFIER = com.mldynamic.myca.us;/g" ios/Runner.xcodeproj/project.pbxproj
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName MyCA US' ios/Runner/Info.plist
            echo "BUNDLE_ID=com.mldynamic.myca.us" >> "$GITHUB_ENV"
            echo "EDITION_DEFINE=--dart-define=MYCA_EDITION=US" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_ID=com.mldynamic.myca" >> "$GITHUB_ENV"
            echo "EDITION_DEFINE=--dart-define=MYCA_EDITION=IN" >> "$GITHUB_ENV"
          fi

      - name: Build without signing
        if: env.HAS_APPLE_SIGNING != 'true'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          define=("$EDITION_DEFINE")
          if [ -n "$CLOUD_URL" ]; then define+=(--dart-define="MYCA_CLOUD_URL=$CLOUD_URL"); fi
          flutter build ios --release --no-codesign "${define[@]}"
          mkdir -p ../dist
          (cd build/ios/iphoneos && zip -qry ../../../../dist/myca-ios-unsigned.zip Runner.app)
          (cd ../dist && shasum -a 256 myca-ios-unsigned.zip > SHA256SUMS-ios.txt)

      - name: Install the distribution certificate and profile in a throwaway keychain
        if: env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ (inputs.app == 'us' && secrets.APPLE_PROVISIONING_PROFILE_BASE64_US) || secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/myca-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" "$(security list-keychains -d user | tr -d '" ')"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/myca.mobileprovision"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/myca.mobileprovision")")"
          cp "$RUNNER_TEMP/myca.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12"

      - name: Build the signed archive and export the App Store IPA
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: mobile
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ (inputs.app == 'us' && secrets.APPLE_PROFILE_NAME_US) || secrets.APPLE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          define=("$EDITION_DEFINE")
          if [ -n "$CLOUD_URL" ]; then define+=(--dart-define="MYCA_CLOUD_URL=$CLOUD_URL"); fi
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" "${define[@]}"
          mkdir -p ../dist
          cp build/ios/ipa/*.ipa ../dist/
          (cd ../dist && shasum -a 256 *.ipa > SHA256SUMS-ios.txt)

      - name: Upload the IPA to TestFlight
        if: env.HAS_APPLE_SIGNING == 'true' && env.HAS_APP_STORE_KEY == 'true'
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          ipa="$(ls dist/*.ipa | head -n1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      - name: Say what this build is
        shell: bash
        run: |
          {
            echo "### iOS build: $APP ($BUNDLE_ID)"
            if [ "$HAS_APPLE_SIGNING" = "true" ]; then
              echo "- Signed App Store IPA built."
              if [ "$HAS_APP_STORE_KEY" = "true" ]; then echo "- Uploaded to TestFlight; it appears in App Store Connect after Apple processes it."; else echo "- Not uploaded: no App Store Connect API key secret; upload the IPA with Transporter."; fi
            else
              echo "- Unsigned Runner.app: not installable until the Apple secrets in docs/release/APP-STORE.md section 3 exist, or the owner signs it in Xcode."
            fi
            if [ -n "$CLOUD_URL" ]; then echo "- Hosted mode: \`$CLOUD_URL\`"; else echo "- Local mode: no MYCA_CLOUD_URL variable set."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myca-ios
          path: dist/
          if-no-files-found: error
