name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - "deploy/pages/**"
      - "deploy/site/default.conf.template"
      - "deploy/wrangler.jsonc"
      - "deploy/package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build the static site and publish it to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: ${{ vars.MYCA_PAGES_PROJECT || 'myca-site' }}
      SITE_ORIGIN_OVERRIDE: ${{ vars.MYCA_SITE_ORIGIN }}
      MYCA_EARLY_ACCESS_URL: ${{ vars.MYCA_EARLY_ACCESS_URL }}
      REF_NAME: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: ready
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::notice::Skipped: add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to publish to Cloudflare Pages."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.go == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: "22"

      - name: Check the pages before publishing
        if: steps.ready.outputs.go == 'true'
        run: node --test deploy/seo/*.test.mjs deploy/pages/*.test.mjs

      - name: Make sure the Pages project exists and find its address
        if: steps.ready.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          status="$(curl -sS -o project.json -w '%{http_code}' "${auth[@]}" "$api/$PROJECT")"
          if [[ "$status" == "404" ]]; then
            body="$(jq -n --arg name "$PROJECT" '{name: $name, production_branch: "main"}')"
            curl -fsS -o project.json "${auth[@]}" -X POST "$api" --data "$body"
          elif [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare answered $status for project $PROJECT. Check the token has Account > Cloudflare Pages > Edit."; cat project.json; exit 1
          fi
          subdomain="$(jq -r '.result.subdomain' project.json)"
          [[ "$subdomain" =~ ^[a-z0-9.-]+\.pages\.dev$ ]] || { echo "::error::unexpected Pages address: $subdomain"; exit 1; }
          origin="https://$subdomain"
          if [[ -n "$SITE_ORIGIN_OVERRIDE" ]]; then
            [[ "$SITE_ORIGIN_OVERRIDE" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::MYCA_SITE_ORIGIN must look like https://www.example.com"; exit 1; }
            origin="$SITE_ORIGIN_OVERRIDE"
          fi
          rm -f project.json
          echo "SITE_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "PAGES_DEV=https://$subdomain" >> "$GITHUB_ENV"

      - name: Build the static site
        if: steps.ready.outputs.go == 'true'
        run: node deploy/pages/build.mjs

      - name: Publish to Cloudflare Pages
        if: steps.ready.outputs.go == 'true'
        working-directory: deploy
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler pages deploy --project-name "$PROJECT" --branch "$REF_NAME" --commit-hash "$COMMIT" --commit-dirty=true

      - name: Check the live site
        if: steps.ready.outputs.go == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          for path in / /privacy /delete-account /us; do curl -fsS -o /dev/null "$PAGES_DEV$path"; done
          headers="$(curl -fsS -D - -o /dev/null "$PAGES_DEV/")"
          for name in content-security-policy strict-transport-security x-content-type-options permissions-policy; do
            grep -qi "^$name:" <<<"$headers" || { echo "::error::the live site does not send $name"; exit 1; }
          done
          status="$(curl -sS -o missing.html -w '%{http_code}' "$PAGES_DEV/this-page-does-not-exist")"
          [[ "$status" == "404" ]] && grep -q 'This page is not in our books' missing.html || { echo "::error::the live site has no MyCA 404 page (got $status)"; exit 1; }
          echo "### Site published to $PAGES_DEV (canonical address $SITE_ORIGIN)" >> "$GITHUB_STEP_SUMMARY"
