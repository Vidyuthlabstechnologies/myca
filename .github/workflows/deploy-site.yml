name: Deploy site (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - "deploy/firebase.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish deploy/public to Firebase Hosting
    # Skips cleanly until the deploy identity and project are set as GitHub variables.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Deploy
        working-directory: deploy
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting --project "$PROJECT" --non-interactive

      - name: Summary
        run: echo "### Site deployed to https://${PROJECT}.web.app" >> "$GITHUB_STEP_SUMMARY"
