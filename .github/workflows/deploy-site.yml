name: Deploy site (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - "deploy/site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Build the site image and roll out
    # Skips cleanly until the deploy identity and project are set as GitHub variables.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_API_REGION || 'asia-south1' }}
      IMAGE: ${{ vars.GCP_API_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/myca-api/myca-site:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/site/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          pinned="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          [[ "$pinned" == *@sha256:* ]] || { echo "::error::the pushed image has no digest"; exit 1; }
          echo "IMAGE_PINNED=$pinned" >> "$GITHUB_ENV"

      - name: Roll out the image by digest
        shell: bash
        env:
          EARLY_ACCESS_URL: ${{ vars.MYCA_EARLY_ACCESS_URL }}
        run: |
          set -euo pipefail
          if [[ -n "$EARLY_ACCESS_URL" && ! "$EARLY_ACCESS_URL" =~ ^https://[A-Za-z0-9._~:/?#@%=+,-]+$ ]]; then
            echo "::error::MYCA_EARLY_ACCESS_URL must be a plain https:// form address"; exit 1
          fi
          gcloud run deploy myca-site --project "$PROJECT" --region "$REGION" --image "$IMAGE_PINNED" \
            --update-env-vars "^@^MYCA_EARLY_ACCESS_URL=${EARLY_ACCESS_URL}" --quiet

      - name: Check the privacy policy answers
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe myca-site --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          curl -fsS -o /dev/null "$url/privacy"
          curl -fsS -o /dev/null "$url/delete-account"
          echo "### Site deployed to $url" >> "$GITHUB_STEP_SUMMARY"
