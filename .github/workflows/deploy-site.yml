name: Deploy site (GCP)

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to GCS + purge CDN
    # Skips cleanly until Akhil's bootstrap + GitHub variables are in place.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.GCP_SITE_BUCKET }}
      URL_MAP: ${{ vars.GCP_URL_MAP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload site
        run: |
          gcloud storage rsync deploy/public "gs://${SITE_BUCKET}" \
            --recursive \
            --delete-unmatched-destination-objects

      - name: Set HTML cache headers
        run: |
          gcloud storage objects update "gs://${SITE_BUCKET}/**" \
            --cache-control="public, max-age=300, must-revalidate"

      - name: Purge Cloud CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${URL_MAP}" \
            --path "/*" --async

      - name: Summary
        run: |
          {
            echo "### Site deployed"
            echo "- Bucket: \`${SITE_BUCKET}\`"
            echo "- CDN invalidated: \`${URL_MAP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
