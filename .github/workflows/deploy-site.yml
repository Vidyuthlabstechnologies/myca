name: Deploy site (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - "scripts/deploy-site.sh"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish deploy/public to Firebase Hosting
    # Skips cleanly until the deploy identity and project are set as GitHub variables.
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish deploy/public
        run: scripts/deploy-site.sh "$PROJECT" deploy/public

      - name: Summary
        run: echo "### Site deployed to https://${PROJECT}.web.app" >> "$GITHUB_STEP_SUMMARY"
