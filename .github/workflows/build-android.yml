name: Build Android app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      backend:
        description: "Which backend the app talks to: live (MYCA_CLOUD_URL) or test (MYCA_CLOUD_URL_STAGING, installs beside the live app as MyCA Test)"
        type: choice
        options: [live, test]
        default: live

permissions:
  contents: read

jobs:
  build:
    name: Release APK and app bundle
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BACKEND: ${{ inputs.backend || 'live' }}
      CLOUD_URL: ${{ inputs.backend == 'test' && vars.MYCA_CLOUD_URL_STAGING || vars.MYCA_CLOUD_URL }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.MYCA_GOOGLE_SERVER_CLIENT_ID }}
      OIDC_CLIENT_ID: ${{ vars.MYCA_OIDC_CLIENT_ID }}
    steps:
      - name: Refuse a tagged release that Play would reject
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          problems=()
          [ "$HAS_KEYSTORE" = "true" ] || problems+=("no upload key: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD")
          case "$CLOUD_URL" in
            https://*) ;;
            *) problems+=("MYCA_CLOUD_URL must be the https address of the deployed hosted API (now: '${CLOUD_URL}')") ;;
          esac
          case "$GOOGLE_SERVER_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) problems+=("MYCA_GOOGLE_SERVER_CLIENT_ID must be the web OAuth client id (ends in .apps.googleusercontent.com), or the Play build has no Google sign-in (now: '${GOOGLE_SERVER_CLIENT_ID}')") ;;
          esac
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || problems+=("the tag must look like v1.2.3 (now: $GITHUB_REF_NAME)")
          if [ "${#problems[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${problems[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter at the pinned version
        shell: bash
        env:
          FLUTTER_VERSION: "3.44.9"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test before building
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Install the upload key
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=$PWD/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          define=(--build-number="$GITHUB_RUN_NUMBER")
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; define+=(--build-name="$name"); fi
          define+=(--dart-define="MYCA_APP_VERSION=$name+$GITHUB_RUN_NUMBER")
          if [ "$BACKEND" = "test" ]; then
            if [ -z "$CLOUD_URL" ]; then echo "::error::A test build needs the MYCA_CLOUD_URL_STAGING repository variable (the staging API address)."; exit 1; fi
            define+=(-P mycaTest=true)
          fi
          if [ -n "$CLOUD_URL" ]; then define+=(--dart-define="MYCA_CLOUD_URL=$CLOUD_URL"); fi
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then define+=(--dart-define="MYCA_GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"); fi
          if [ -n "$OIDC_CLIENT_ID" ]; then define+=(--dart-define="MYCA_OIDC_CLIENT_ID=$OIDC_CLIENT_ID"); fi
          flutter build apk --release "${define[@]}"
          flutter build appbundle --release "${define[@]}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/myca-android.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/myca-android.aab
          (cd ../dist && sha256sum myca-android.apk myca-android.aab > SHA256SUMS-android.txt)
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          {
            echo "### Release APK badging"
            echo '```'
            "$aapt2" dump badging ../dist/myca-android.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$aapt2" dump permissions ../dist/myca-android.apk | sed -n "s/^uses-permission: name='\\([^']*\\)'.*/\\1/p" | sort -u > ../dist/permissions.txt
          if ! diff -u android/permissions.txt ../dist/permissions.txt; then echo "::error::The release APK asks for a different set of permissions than mobile/android/permissions.txt. Update that file and docs/release/PLAY-LISTING.md section 3 together."; exit 1; fi

      - name: Remove the key from the runner
        if: always()
        run: rm -f mobile/android/upload.jks mobile/android/key.properties

      - name: Say how it was signed
        shell: bash
        run: |
          {
            echo "### Android build"
            if [ "$HAS_KEYSTORE" = "true" ]; then echo "- Signed with the upload key: ready for Play."; else echo "- Signed with the debug key: installable for testing, not uploadable to Play. Add ANDROID_KEYSTORE_BASE64 and the three key secrets to sign."; fi
            if [ -n "$CLOUD_URL" ]; then echo "- Hosted mode: \`$CLOUD_URL\`"; else echo "- Local mode: no MYCA_CLOUD_URL variable set."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myca-android
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-android
          path: dist
      - name: Upload the files to the tag's release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "MyCA $tag" --draft=false
          fi
          gh release upload "$tag" dist/myca-android.apk dist/myca-android.aab dist/SHA256SUMS-android.txt --repo "$GITHUB_REPOSITORY" --clobber

  play:
    name: Upload the bundle to Google Play
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PLAY_TRACK != '' }}
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-android
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Upload to the chosen track (draft unless PLAY_RELEASE_STATUS says completed)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: ${{ vars.PLAY_PACKAGE || 'com.mldynamic.myca' }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: node scripts/play-upload.mjs dist/myca-android.aab | tee -a "$GITHUB_STEP_SUMMARY"
