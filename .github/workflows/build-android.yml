name: Build Android app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release APK and app bundle
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_URL: ${{ vars.MYCA_CLOUD_URL }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.MYCA_GOOGLE_SERVER_CLIENT_ID }}
      OIDC_CLIENT_ID: ${{ vars.MYCA_OIDC_CLIENT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Refuse a tagged release that Play would reject
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          problems=()
          [ -n "$WIF_PROVIDER" ] || problems+=("no upload key: set GCP_WIF_PROVIDER and GCP_DEPLOY_SA so the build can read the key from Secret Manager")
          case "$CLOUD_URL" in
            https://*) ;;
            *) problems+=("MYCA_CLOUD_URL must be the https address of the deployed hosted API (now: '${CLOUD_URL}')") ;;
          esac
          case "$GOOGLE_SERVER_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) problems+=("MYCA_GOOGLE_SERVER_CLIENT_ID must be the web OAuth client id (ends in .apps.googleusercontent.com), or the Play build has no Google sign-in (now: '${GOOGLE_SERVER_CLIENT_ID}')") ;;
          esac
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || problems+=("the tag must look like v1.2.3 (now: $GITHUB_REF_NAME)")
          if [ "${#problems[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${problems[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter at the pinned version
        shell: bash
        env:
          FLUTTER_VERSION: "3.44.9"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test before building
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Sign in to Google Cloud to read the upload key
        if: ${{ vars.GCP_WIF_PROVIDER != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: ${{ vars.GCP_WIF_PROVIDER != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

      - name: Install the upload key from Secret Manager
        if: ${{ vars.GCP_WIF_PROVIDER != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          read_secret() { gcloud secrets versions access latest --project "$PROJECT" --secret "$1" 2>/dev/null; }
          if ! keystore="$(read_secret myca-android-keystore-base64)" || [ -z "$keystore" ]; then
            echo "No upload key in Secret Manager yet; building with the debug key."
            exit 0
          fi
          umask 077
          printf '%s' "$keystore" | base64 -d > upload.jks
          store_password="$(read_secret myca-android-keystore-password)"
          key_alias="$(read_secret myca-android-key-alias)"
          key_password="$(read_secret myca-android-key-password)"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "storeFile=$PWD/upload.jks"
            echo "storePassword=$store_password"
            echo "keyAlias=$key_alias"
            echo "keyPassword=$key_password"
          } > key.properties
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Refuse an unsigned tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${HAS_KEYSTORE:-}" != "true" ]; then
            echo "::error::no upload key: add the four myca-android-* secret versions in Secret Manager (project $PROJECT)"
            exit 1
          fi

      - name: Build
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          define=(--build-number="$GITHUB_RUN_NUMBER")
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; define+=(--build-name="$name"); fi
          define+=(--dart-define="MYCA_APP_VERSION=$name+$GITHUB_RUN_NUMBER")
          if [ -n "$CLOUD_URL" ]; then define+=(--dart-define="MYCA_CLOUD_URL=$CLOUD_URL"); fi
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then define+=(--dart-define="MYCA_GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"); fi
          if [ -n "$OIDC_CLIENT_ID" ]; then define+=(--dart-define="MYCA_OIDC_CLIENT_ID=$OIDC_CLIENT_ID"); fi
          flutter build apk --release "${define[@]}"
          flutter build appbundle --release "${define[@]}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/myca-android.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/myca-android.aab
          (cd ../dist && sha256sum myca-android.apk myca-android.aab > SHA256SUMS-android.txt)
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          {
            echo "### Release APK badging"
            echo '```'
            "$aapt2" dump badging ../dist/myca-android.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f mobile/android/upload.jks mobile/android/key.properties gha-creds-*.json

      - name: Say how it was signed
        shell: bash
        run: |
          {
            echo "### Android build"
            if [ "${HAS_KEYSTORE:-}" = "true" ]; then echo "- Signed with the upload key: ready for Play."; else echo "- Signed with the debug key: installable for testing, not uploadable to Play. Add the four myca-android-* secret versions in Secret Manager to sign."; fi
            if [ -n "$CLOUD_URL" ]; then echo "- Hosted mode: \`$CLOUD_URL\`"; else echo "- Local mode: no MYCA_CLOUD_URL variable set."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myca-android
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-android
          path: dist
      - name: Upload the files to the tag's release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "MyCA $tag" --draft=false
          fi
          gh release upload "$tag" dist/myca-android.apk dist/myca-android.aab dist/SHA256SUMS-android.txt --repo "$GITHUB_REPOSITORY" --clobber

  play:
    name: Upload the bundle to Google Play
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PLAY_TRACK != '' && vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get a Play publishing token for the CI identity (no stored key)
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myca-android
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Upload to the chosen track (draft unless PLAY_RELEASE_STATUS says completed)
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_PACKAGE: ${{ vars.PLAY_PACKAGE || 'com.mldynamic.myca' }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: node scripts/play-upload.mjs dist/myca-android.aab | tee -a "$GITHUB_STEP_SUMMARY"
