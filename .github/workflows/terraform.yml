name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_site_bucket_name: ${{ vars.GCP_SITE_BUCKET }}
  TF_VAR_artifacts_bucket_name: ${{ vars.GCP_ARTIFACTS_BUCKET }}
  TF_VAR_downloads_bucket_name: ${{ vars.GCP_DOWNLOADS_BUCKET }}
  TF_VAR_domain_name: ${{ vars.GCP_DOMAIN }}
  TF_VAR_manage_dns: ${{ vars.GCP_MANAGE_DNS }}
  TF_VAR_create_artifact_registry: ${{ vars.GCP_CREATE_ARTIFACT_REGISTRY }}
  TF_VAR_alert_email: ${{ vars.GCP_ALERT_EMAIL }}

jobs:
  check:
    name: Format and validate (no cloud access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Terraform validate (root and bootstrap)
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate -no-color
          done

  plan:
    name: Plan (pull request, read-only)
    needs: check
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PLAN_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (read-only planner)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform plan
        run: terraform plan -no-color -input=false -lock=false

  apply:
    name: Apply (main)
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (deployer)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform apply
        run: terraform apply -auto-approve -no-color -input=false -lock-timeout=10m
