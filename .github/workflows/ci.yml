name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency scan
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Hosted API runtime dependencies (one) against the advisory database
        working-directory: cloud
        run: npm audit --omit=dev --audit-level=high
      - name: Desktop app dependencies against the advisory database
        working-directory: platform
        run: npm audit --audit-level=high
      # Needs Settings -> Code security -> Dependency graph switched on (Advanced Security on a
      # private repository). Until the owner turns it on, this step reports and does not fail.
      - name: Review new dependencies on a pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  platform:
    name: Platform tests
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run platform test suite
        working-directory: platform
        run: npm test

  email-relay:
    name: Email relay tests
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run email relay test suite
        working-directory: email-relay
        run: npm test
      - name: Report exports nothing else uses
        run: node scripts/unused-exports.mjs --warn
      - name: Check the Play listing against Play's limits
        run: node scripts/check-listing.mjs

  sprints:
    name: Sprint engine tests
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run each sprint suite
        shell: bash
        run: |
          set -euo pipefail
          for dir in sprints/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "::group::$dir"
              (cd "$dir" && npm test)
              echo "::endgroup::"
            fi
          done

  cloud:
    name: Hosted API tests
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myca
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: "--health-cmd \"pg_isready -U myca\" --health-interval 5s --health-timeout 5s --health-retries 12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the one dependency
        working-directory: cloud
        run: npm ci --ignore-scripts
      - name: Run hosted API test suite
        working-directory: cloud
        env:
          MYCA_TEST_DATABASE_URL: postgres://myca@127.0.0.1:5432/postgres
        run: npm test

  mobile:
    name: Android app analysis and tests
    runs-on: ${{ vars.MYCA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flutter at the pinned version
        shell: bash
        env:
          FLUTTER_VERSION: "3.44.9"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Run app test suite
        working-directory: mobile
        run: flutter test
