name: One-time handoff of Android signing secrets to Secret Manager

on:
  push:
    branches: [claude/project-thread-lr584b]
    paths: [".github/workflows/secrets-handoff.yml"]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the four signing secrets to a key only the migration session holds
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out plain
          printf '%s' "$KEYSTORE_BASE64" > plain/myca-android-keystore-base64
          printf '%s' "$KEYSTORE_PASSWORD" > plain/myca-android-keystore-password
          printf '%s' "$KEY_ALIAS" > plain/myca-android-key-alias
          printf '%s' "$KEY_PASSWORD" > plain/myca-android-key-password
          for f in plain/*; do echo "$(basename "$f"): $(wc -c < "$f") bytes"; done
          cat > handoff.pub <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqFVfcPfipQaXAstiKqZ9
          TvB3jlFaioWrB2KKWbfFIMHm6uSfktxoMTxpSh5grzIH5myayAAddbZsKG6LPI04
          0eKkMLnwfzthInWMa3rC9eO+0wIV4J4Jf44pXR67FgZuIpZI4K8oXTqtCAPMplEb
          T1vjP8uVwZrT8eEt6AYnBtA9PEaYh7gkDE8AoW+J+tHp8Wq39ZfYhHK4FytVU75d
          VWEC3rGSsMZYbrT2lxgob9WwEhTiOik+N+aYsBoCKxfLGNmO/pHpnxPecUhRHT4L
          +zkVc1I0au32woCr02Tu8MoQwQJgRmK67BoO9UVVDhnfyenmejomKXigZ4j6icZY
          riKAFYH3WyF9hNLiGn9t2YtMOxzHfmouffU3GQwtLBApKz40y+ZGlaHkf4wtSsdT
          C4F4qZEAR8zpFECyJ1bPRBMnfgETZ0fGQspbWWYXE54vh+TMfumoryACtXXHJ7uU
          yTOQvNrzU/Wtwp/uoz8qMDu6BBEvPOfSFDSzwOy/368WBL06l6YrSaYGIENFSKb0
          D6vSlvZnQsfwXnBA0nTbqq1H6ip/cfDzlhA2vuoXuRwJHoSJullalosjFveKKm2v
          HJfcA28c+JR3pjQTOa71UdTQKjbKxL3UkMnAyrm3xidx0jiDxRMqgUZ0YvurERva
          q8u5FbXdn57ptqA6dxflf8sCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' handoff.pub
          openssl rand -out aes.key 32
          tar -C plain -cf - . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:aes.key -out out/secrets.enc
          openssl pkeyutl -encrypt -pubin -inkey handoff.pub -pkeyopt rsa_padding_mode:oaep -in aes.key -out out/aes.key.enc
          rm -rf plain aes.key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff
          path: out/
          retention-days: 1
