<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyCA Malaysia sales sheet</title>
<style>
:root{--blue:#0E4D92;--blue-soft:#E6EEF8;--sky:#8DB6EC;--night:#14233A;--gold:#F2B705;--ink:#15181B;--canvas:#FAFAF7;--white:#FFFFFF;--slate:#6C7075;--line:#E6E4DE;--amber:#94570A;--red:#B3261E;--bahi-red:#C8312B;--bahi-gold:#E2A93B;--paper:#FFF8EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.tab{font-variant-numeric:tabular-nums}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.3px}
.wordmark .country{color:var(--blue);font-weight:500}
.on-blue .wordmark{color:#fff}
.on-blue .wordmark .country{color:var(--gold)}
.mark{display:block}

.page{width:595px;height:842px;background:#fff;position:relative;overflow:hidden;margin:0 auto 24px;display:flex;flex-direction:column}
.head{background:var(--blue);color:#fff;padding:26px 34px 22px;position:relative;height:190px;flex:none}
.head .wordmark{font-size:18px}
.head .wordmark svg{width:28px;height:28px}
.head h1{font-size:26px;line-height:1.1;font-weight:500;letter-spacing:-.9px;margin-top:18px;max-width:340px}
.head .bar{width:48px;height:5px;border-radius:3px;background:var(--gold);margin-top:16px}
.head img{position:absolute;right:34px;bottom:-14px;width:128px}
.main{padding:22px 34px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
h2{font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
p,li{font-size:10.5px;line-height:1.42}
ul{list-style:none}
ul li{padding-left:14px;position:relative;margin-bottom:4px}
ul li:before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
ol{list-style:none;counter-reset:n}
ol li{counter-increment:n;padding-left:22px;position:relative;margin-bottom:5px}
ol li:before{content:counter(n);position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:9.5px;font-weight:600;text-align:center;line-height:15px}
.firm{grid-column:span 2;background:var(--blue-soft);border-radius:14px;padding:12px 16px}
.firm p{color:var(--ink)}
.plans{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.plan b{font-size:12.5px;font-weight:600;display:block}
.plan .p{font-size:20px;font-weight:600;letter-spacing:-.5px;color:var(--blue);margin:2px 0}
.plan .p small{font-size:11px;font-weight:500;color:var(--slate);letter-spacing:0}
.plan span{font-size:10.5px;color:var(--slate);line-height:1.35;display:block}
.cta{grid-column:span 2;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.cta .btn{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.cta p{font-size:10px;color:var(--slate);text-align:right;margin-left:16px;line-height:1.45}
.small{margin-top:auto;padding:0 34px 18px;font-size:8.5px;color:var(--slate);line-height:1.4}
</style>
</head>

const C={
en:{h:'E-invoices, SST and books. You approve each one.',
 prob:['The problem','E-invoicing is mandatory at RM3 million annual turnover and above, the rules keep changing, and only 30% of SMEs say they fully understand them (Xero whitepaper, 2025). Owners want a checklist, not a manual.'],
 what:['What MyCA does',['Prepares e-invoices for LHDN MyInvois from your phone and submits them, as your intermediary, only after you approve.','Builds the monthly consolidated e-invoice, keeps sales above RM10,000 out, reminds you before the 7-day deadline.','Prepares SST-02 figures for MySST and your Form BE / B estimate for MyTax.','English and Bahasa Melayu. Ask Bahi, with the source.']],
 why:['Why owners choose it',['Nothing goes to LHDN until you approve.','MyInvois setup walked through step by step, then tested.','Rules built in: RM3 million threshold, RM10,000 limit, 72-hour cancel window.','Your accountant on the same books.','Encrypted, hosted in Google Cloud Singapore, export any time.']],
 firm:['For accounting firms','Act as intermediary for many clients, prepare their consolidated batches, and let each client approve on their phone.'],
 plans:[['SME','299','One business: e-invoices, consolidated batch, SST, books, tax estimate'],['Growth','699','More people, bank matching, priority support'],['Firm','1,999','Accounting firms: many clients, client approvals']],
 per:'/ month',plansNote:'Billed monthly through Google Play. Cancel any time.',
 cta:'Get MyCA Malaysia on Google Play',ctaP:'Or book a 30-minute walkthrough: [WhatsApp +60] · [email] · [website]',
 small:'MyCA is not affiliated with LHDN, the Royal Malaysian Customs Department or the Government of Malaysia, and is not a tax agent. You file income tax in MyTax and SST in MySST yourself. Facts checked 14 Nov 2026: IRBM e-Invoice Guideline v4.8 and Specific Guideline v4.9. ML Dynamic Solutions Private Limited.'},
ms:{h:'E-Invois, SST dan buku akaun. Anda yang meluluskan.',
 prob:['Masalahnya','E-Invois wajib bagi jualan tahunan RM3 juta dan ke atas, peraturannya sering berubah, dan hanya 30% PKS benar-benar memahaminya (kertas putih Xero, 2025). Pemilik mahukan senarai semak, bukan manual.'],
 what:['Apa yang MyCA lakukan',['Menyediakan e-Invois untuk LHDN MyInvois dari telefon anda dan menghantarnya, sebagai perantara anda, hanya selepas anda meluluskannya.','Menyediakan e-Invois disatukan bulanan, mengasingkan jualan melebihi RM10,000, mengingatkan anda sebelum tarikh akhir 7 hari.','Menyediakan angka SST-02 untuk MySST dan anggaran Borang BE / B untuk MyTax.','Bahasa Melayu dan Bahasa Inggeris. Tanya Bahi, berserta sumber.']],
 why:['Mengapa pemilik memilihnya',['Tiada apa dihantar ke LHDN sehingga anda meluluskannya.','Persediaan MyInvois dibimbing langkah demi langkah, kemudian diuji.','Peraturan sedia ada: ambang RM3 juta, had RM10,000, tempoh pembatalan 72 jam.','Akauntan anda pada buku akaun yang sama.','Disulitkan, disimpan di Google Cloud Singapura, eksport bila-bila masa.']],
 firm:['Untuk firma perakaunan','Bertindak sebagai perantara untuk ramai pelanggan, sediakan kelompok disatukan mereka, dan biarkan setiap pelanggan meluluskan di telefon.'],
 plans:[['SME','299','Satu perniagaan: e-Invois, kelompok disatukan, SST, buku akaun, anggaran cukai'],['Growth','699','Lebih ramai pengguna, padanan bank, sokongan keutamaan'],['Firm','1,999','Firma perakaunan: ramai pelanggan, kelulusan pelanggan']],
 per:'/ bulan',plansNote:'Dibilkan setiap bulan melalui Google Play. Batal bila-bila masa.',
 cta:'Dapatkan MyCA Malaysia di Google Play',ctaP:'Atau tempah sesi tunjuk cara 30 minit: [WhatsApp +60] · [e-mel] · [laman web]',
 small:'MyCA tidak bergabung dengan LHDN, Jabatan Kastam Diraja Malaysia atau Kerajaan Malaysia, dan bukan ejen cukai. Anda memfailkan cukai pendapatan di MyTax dan SST di MySST sendiri. Fakta disemak 14 Nov 2026: Garis Panduan e-Invois LHDN v4.8 dan Garis Panduan Khusus v4.9. ML Dynamic Solutions Private Limited.'}};
function e(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function page(l){const c=C[l];const d=document.createElement('div');d.className='page';d.id='sheet-'+l;d.lang=l==='ms'?'ms':'en';
d.innerHTML=`<div class="head on-blue"><span class="wordmark">${MARK_WHITE}<span>MyCA <span class="country">Malaysia</span></span></span><h1>${e(c.h)}</h1><div class="bar"></div><img alt="Bahi" src="${BAHI}"></div>
<div class="main">
<div><h2>${e(c.prob[0])}</h2><p>${e(c.prob[1])}</p><h2 style="margin-top:14px">${e(c.what[0])}</h2><ul>${c.what[1].map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>
<div><h2>${e(c.why[0])}</h2><ol>${c.why[1].map(x=>`<li>${e(x)}</li>`).join('')}</ol></div>
<div class="firm"><h2>${e(c.firm[0])}</h2><p>${e(c.firm[1])}</p></div>
<div class="plans">${c.plans.map(p=>`<div class="plan"><b>${p[0]}</b><div class="p tab">RM${p[1]} <small>${e(c.per)}</small></div><span>${e(p[2])}</span></div>`).join('')}</div>
<div class="cta"><span class="btn">${e(c.cta)}</span><p>${e(c.plansNote)}<br>${e(c.ctaP)}</p></div>
</div><div class="small">${e(c.small)}</div>`;return d}
const q=new URLSearchParams(location.search);const r=document.getElementById('root');
(q.get('lang')?[q.get('lang')]:['en','ms']).forEach(l=>r.appendChild(page(l)));
</script>
