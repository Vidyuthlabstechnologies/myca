<style>
:root{--blue:#0E4D92;--blue-soft:#E6EEF8;--sky:#8DB6EC;--night:#14233A;--gold:#F2B705;--ink:#15181B;--canvas:#FAFAF7;--white:#FFFFFF;--slate:#6C7075;--line:#E6E4DE;--amber:#94570A;--red:#B3261E;--bahi-red:#C8312B;--bahi-gold:#E2A93B;--paper:#FFF8EC}

html,body{background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.tab{font-variant-numeric:tabular-nums}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.3px}
.wordmark .country{color:var(--blue);font-weight:500}
.on-blue .wordmark{color:#fff}
.on-blue .wordmark .country{color:var(--gold)}
.mark{display:block}

body{padding:0}
#fg{width:512px;height:250px;position:relative;overflow:hidden;background:var(--canvas)}
#fg .text{position:absolute;left:28px;top:24px;width:262px;height:206px;display:flex;flex-direction:column}

#fg .wordmark svg{width:26px;height:26px}
#fg h1{font-size:25px;line-height:1.1;font-weight:500;letter-spacing:-.8px;margin-top:22px}
#fg .bar{width:44px;height:5px;border-radius:3px;background:var(--gold);margin:12px 0 10px}
#fg p{font-size:12.5px;color:var(--slate);line-height:1.4}
#fg .disc{margin-top:auto;font-size:8px;color:var(--slate)}
#fg .circle{position:absolute;left:312px;top:-26px;width:300px;height:300px;border-radius:50%;background:var(--blue)}
#fg .dot{position:absolute;left:318px;top:196px;width:20px;height:20px;border-radius:50%;background:var(--gold)}
#fg img{position:absolute;left:330px;top:40px;width:170px}
</style>
