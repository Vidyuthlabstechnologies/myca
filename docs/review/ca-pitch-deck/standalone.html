    { "sceneId": "s-title", "fragments": [3.0, 6.0], "notes": "60 minutes, two CAs. Goal: show the owner flow end to end, show exactly where a CA stays in control, and hear what would stop you trusting this with a client. Push back at any slide." },

    { "sceneId": "s-expenses", "notes": "Same propose and confirm contract as sales. The Expense versus Asset choice changes posting, and cash versus bank is explicit at entry. Ask: do these heads cover a retail counter?" },

    { "sceneId": "s-taxes", "fragments": [113.0, 116.0], "notes": "Maker-checker review: sales, then purchases, then approve. Figures restated at the gate, reviewer recorded. Filing itself stays on the portal or with the CA and the ARN is recorded back. MyCA does not work out the amount to pay." },
