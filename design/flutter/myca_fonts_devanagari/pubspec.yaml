name: myca_fonts_devanagari
description: Noto Sans Devanagari for MyCA apps that show Devanagari script. Add it only to apps that need it.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Noto Sans Devanagari
      fonts:
        - asset: fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
