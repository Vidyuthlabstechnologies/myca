name: myca_fonts_arabic
description: Noto Sans Arabic for MyCA apps that show Arabic script. Add it only to apps that need it.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
